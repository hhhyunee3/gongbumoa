name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 액션 기본값은 wrangler 3.x 라 public/_headers 를 헤더 규칙이 아니라
          # 그냥 정적 파일로 올린다. 그러면 /images/* 30일 캐시가 걸리지 않고
          # /_headers 주소가 그대로 노출된다. 4.x 를 명시한다.
          wranglerVersion: "4.129.0"
          command: deploy
